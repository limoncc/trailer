# Trailer 发布 CI
# - build-server:Linux trailer-server 二进制(embed-frontend + pg),amd64 + arm64
# - build-sdk:Python SDK wheel(Linux / macOS / Windows)
# - publish:打 tag(v*) 时上传 GitHub Release
#
# 触发:手动(workflow_dispatch) 或 推送 v* tag

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ───────────────────────────── 文档站(Starlight) ─────────────────────────────
  build-docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Build docs (Starlight)
        run: |
          cd docs
          pnpm install --frozen-lockfile
          pnpm build
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error

  # ───────────────────────────── 文档 skill 包 ─────────────────────────────
  build-skill:
    name: Skill pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate docs skill pack
        run: |
          node docs/scripts/generate-skill.mjs \
            --source docs/src/content/docs \
            --output dist/skill \
            --name trailer-docs \
            --description "Trailer 项目使用文档(安装/快速开始/部署/SDK/Web UI)。处理 Trailer 相关问题或查询用法时查阅。"

      # 打包成 zip, 避免 merge-multiple 后 skill 的散文件直接平铺到 Release
      - name: Package skill as zip
        run: |
          cd dist && zip -r skill-trailer-docs.zip skill && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: skill-trailer-docs
          path: dist/skill-trailer-docs.zip
          if-no-files-found: error

  # ───────────────────────────── Linux server 二进制 ─────────────────────────────
  build-server:
    name: Server ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest      # x86_64
            arch: amd64
          - os: ubuntu-24.04-arm   # aarch64(原生 ARM runner)
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: trailer-ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      # embed-frontend 前置条件:前端必须先构建(trailer-ui/build)
      - name: Build frontend
        run: |
          cd trailer-ui
          pnpm install --frozen-lockfile
          pnpm build
          cd ..

      - name: Build server (embed-frontend + pg)
        run: cargo build --release --features pg,embed-frontend -p trailer-server

      - name: Package binary
        run: |
          mkdir -p dist
          tar -czf dist/trailer-server-linux-${{ matrix.arch }}.tar.gz -C target/release trailer-server

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.arch }}
          path: dist/trailer-server-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # ───────────────────────────── SDK wheel(3 平台) ─────────────────────────────
  build-sdk:
    name: SDK ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest = x86_64; ubuntu-24.04-arm = aarch64(原生 ARM runner)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: trailer-ui/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        shell: bash
        run: |
          cd trailer-ui
          pnpm install --frozen-lockfile
          pnpm build
          cd ..

      # 编译 server 二进制并复制进 SDK 包 + 打包前端(frontend/build)
      - name: Build and bundle server
        shell: bash
        run: python build.py

      - name: Build wheel
        shell: bash
        run: |
          pip install maturin
          maturin build --release

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.os }}
          path: target/wheels/*.whl
          if-no-files-found: error

  # ───────────────────────────── GitHub Release 发布 ─────────────────────────────
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-server, build-sdk]
    runs-on: ubuntu-latest
    steps:
      # download-artifact@v4 的 pattern 只支持单个 glob(逗号/换行多 pattern 都匹配 0 个),
      # 故分三次下载, 每次一个 pattern, 合并到 artifacts/
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: server-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sdk-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: skill-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
# 注: PyPI 发布改为手动 —— CI 只构建 wheel 并上传 artifact(sdk-*),
#     由维护者下载后运行 scripts/publish_pypi.sh 发布到 PyPI。

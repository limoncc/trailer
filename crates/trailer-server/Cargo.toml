[package]
name = "trailer-server"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Trailer: Axum HTTP server and API"

[dependencies]
trailer-core = { path = "../trailer-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rmp-serde = "1.3"
clap = { version = "4", features = ["derive", "env"] }
config = "0.15"
rand = "0.8"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path"] }

[features]
pg = ["trailer-core/pg"]
# 编译时把前端(trailer-ui/build)嵌入二进制,实现自包含部署。
# debug-embed:debug 构建也嵌入(否则仅 release 嵌入,开发调试不便)
embed-frontend = ["dep:rust-embed", "rust-embed/debug-embed"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

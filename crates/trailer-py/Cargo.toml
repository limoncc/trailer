[package]
name = "trailer-py"
version = "0.1.4"
edition = "2021"
license.workspace = true
description = "Trailer: PyO3 bridge (WIP — not yet linked to core)"

[lib]
name = "trailer"
crate-type = ["cdylib"]

[dependencies]
trailer-core = { path = "../trailer-core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
tokio = { version = "1", features = ["full"] }
rmp-serde = "1.3"
serde_json = "1"
